name: BrunexBots check

on:
  push:
    paths:
      - 'BrunexBots/**'
      - '.github/workflows/brunexbots-check.yml'
  pull_request:
    paths:
      - 'BrunexBots/**'
      - '.github/workflows/brunexbots-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BrunexBots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: BrunexBots/package.json
      - run: npm install
      - run: npm run check
